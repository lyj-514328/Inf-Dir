<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Office 查看器</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e8eaed;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 14px;
    z-index: 10;
    pointer-events: none;
  }
  #status.error {
    color: #b00020;
    pointer-events: auto;
    padding: 24px;
    white-space: pre-wrap;
  }
  #status.hidden { display: none; }
  #stage { width: 100%; height: 100%; }
  #stage canvas { display: block; }
  #page-badge {
    position: fixed;
    right: 16px;
    bottom: 16px;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 12px;
    z-index: 20;
    pointer-events: none;
  }
  #page-badge.hidden { display: none; }
</style>
</head>
<body>
<div id="status">加载中…</div>
<div id="stage"></div>
<div id="page-badge" class="hidden"></div>
<script type="module">
const statusEl = document.getElementById('status');
const stage = document.getElementById('stage');
const pageBadge = document.getElementById('page-badge');
const params = new URLSearchParams(location.search);
const filePath = params.get('path') ?? '';
const fileName = filePath.split(/[\\/]/).pop() ?? filePath;
const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';
const fileUrl = `${location.origin}/file?path=${encodeURIComponent(filePath)}`;
document.title = fileName || 'Office 查看器';

function fail(err) {
  const msg = err && (err.message ?? String(err));
  statusEl.textContent = `无法打开 ${fileName}\n${msg}`;
  statusEl.classList.add('error');
}

try {
  switch (ext) {
    case 'docx':
    case 'docm':
    case 'dotx':
    case 'dotm': {
      // 连续滚动视图：虚拟化翻页、页面居中、Ctrl+滚轮缩放、窗口 resize 自动重排
      const { DocxScrollViewer } = await import('./docx.mjs');
      const viewer = new DocxScrollViewer(stage, {
        wasmUrl: new URL('./docx_parser_bg.wasm', location.href),
        enableTextSelection: true,
        background: '#e8eaed',
        onVisiblePageChange: (top, total) => {
          pageBadge.textContent = `${top + 1} / ${total}`;
          pageBadge.classList.remove('hidden');
        },
        onError: (e) => fail(e),
      });
      await viewer.load(fileUrl);
      break;
    }
    case 'xlsx':
    case 'xlsm':
    case 'xltx':
    case 'xltm': {
      const { XlsxViewer } = await import('./xlsx.mjs');
      const viewer = new XlsxViewer(stage, {
        wasmUrl: new URL('./xlsx_parser_bg.wasm', location.href),
      });
      await viewer.load(fileUrl);
      break;
    }
    case 'pptx':
    case 'pptm':
    case 'potx':
    case 'potm':
    case 'ppsx':
    case 'ppsm': {
      // 连续滚动视图：虚拟化翻页、幻灯片居中、Ctrl+滚轮缩放、窗口 resize 自适应
      const { PptxScrollViewer } = await import('./pptx.mjs');
      const viewer = new PptxScrollViewer(stage, {
        wasmUrl: new URL('./pptx_parser_bg.wasm', location.href),
        enableTextSelection: true,
        background: '#e8eaed',
        onVisibleSlideChange: (top, total) => {
          pageBadge.textContent = `${top + 1} / ${total}`;
          pageBadge.classList.remove('hidden');
        },
        onError: (e) => fail(e),
      });
      await viewer.load(fileUrl);
      break;
    }
    default:
      throw new Error(`不支持的文件类型: .${ext}`);
  }
  statusEl.classList.add('hidden');
} catch (err) {
  fail(err);
}
</script>
</body>
</html>
