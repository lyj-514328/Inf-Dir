<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Office 查看器</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #e8eaed;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #status {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    font-size: 14px;
    z-index: 10;
    pointer-events: none;
  }
  #status.error {
    color: #b00020;
    pointer-events: auto;
    padding: 24px;
    white-space: pre-wrap;
  }
  #status.hidden { display: none; }
  #stage { width: 100%; height: 100%; }
  #stage canvas { display: block; }
</style>
</head>
<body>
<div id="status">加载中…</div>
<div id="stage"></div>
<script type="module">
const statusEl = document.getElementById('status');
const stage = document.getElementById('stage');
const params = new URLSearchParams(location.search);
const filePath = params.get('path') ?? '';
const fileName = filePath.split(/[\\/]/).pop() ?? filePath;
const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : '';
const fileUrl = `${location.origin}/file?path=${encodeURIComponent(filePath)}`;
document.title = fileName || 'Office 查看器';

function fail(err) {
  const msg = err && (err.message ?? String(err));
  statusEl.textContent = `无法打开 ${fileName}\n${msg}`;
  statusEl.classList.add('error');
}

try {
  switch (ext) {
    case 'docx':
    case 'docm': {
      const { DocxViewer } = await import('./docx.mjs');
      const canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      const viewer = new DocxViewer(canvas, {
        wasmUrl: new URL('./docx_parser_bg.wasm', location.href),
      });
      await viewer.load(fileUrl);
      break;
    }
    case 'xlsx':
    case 'xlsm': {
      const { XlsxViewer } = await import('./xlsx.mjs');
      const viewer = new XlsxViewer(stage, {
        wasmUrl: new URL('./xlsx_parser_bg.wasm', location.href),
      });
      await viewer.load(fileUrl);
      break;
    }
    case 'pptx':
    case 'pptm': {
      const { PptxViewer } = await import('./pptx.mjs');
      const canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      const viewer = new PptxViewer(canvas, {
        wasmUrl: new URL('./pptx_parser_bg.wasm', location.href),
      });
      await viewer.load(fileUrl);
      break;
    }
    default:
      throw new Error(`不支持的文件类型: .${ext}`);
  }
  statusEl.classList.add('hidden');
} catch (err) {
  fail(err);
}
</script>
</body>
</html>
