[package]
name = "project-view"
version = "0.2.0"
edition = "2021"
description = "Inf-Dir Project Quick View host (WebView2 + Java/MPXJ parser)"

[dependencies]
dpi = "0.1"
http = "1"
percent-encoding = "2.3"
serde_json = "1"
viewer-web-shell = { path = "../../viewer-web-shell" }
viewer-window-placement = { path = "../../viewer-window-placement" }
winit = "0.30"
wry = "0.56"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
