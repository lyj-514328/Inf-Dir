[package]
name = "project-view"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Inf-Dir Project Quick View host (WebView2 + mpxj-rs parser)"

[dependencies]
dpi = "0.1"
http = "1"
mpxj-rs = "=0.1.1"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
viewer-web-shell = { path = "../../viewer-web-shell" }
viewer-window-placement = { path = "../../viewer-window-placement" }
winit = "0.30"
wry = "0.56"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
