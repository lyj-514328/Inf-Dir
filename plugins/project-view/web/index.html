<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project View</title>
  <link rel="stylesheet" href="./dhtmlxgantt.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <div class="identity-mark" aria-hidden="true">P</div>
      <div class="identity-copy">
        <strong id="project-title">Project View</strong>
        <span id="project-file">Loading project...</span>
      </div>
      <span class="readonly">Read only</span>
    </div>
    <div class="toolbar-actions">
      <label class="select-control">
        <span>Scale</span>
        <select id="scale-select" aria-label="Time scale">
          <option value="day">Day</option>
          <option value="week" selected>Week</option>
          <option value="month">Month</option>
        </select>
      </label>
      <button id="fit-button" class="command-button" type="button">Fit</button>
      <label class="search-control">
        <span class="search-icon" aria-hidden="true">/</span>
        <input id="search-input" type="search" placeholder="Filter tasks" aria-label="Filter tasks">
      </label>
    </div>
  </header>

  <main class="content">
    <section id="gantt-panel" class="view-panel" aria-label="Gantt chart">
      <div id="gantt-chart" class="chart"></div>
    </section>
    <section id="error-panel" class="empty-panel hidden" aria-live="polite">
      <strong id="error-title">Unable to open project</strong>
      <span id="error-message"></span>
    </section>
    <div id="loading-panel" class="loading-panel" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="loading-message">Reading project file...</span>
    </div>
  </main>

  <footer class="statusbar">
    <span id="task-status">No project loaded</span>
    <span id="selection-status">No task selected</span>
  </footer>

  <script src="./dhtmlxgantt.js"></script>
  <script src="./app.js"></script>
</body>
</html>
