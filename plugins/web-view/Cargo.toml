[package]
name = "web-view"
version = "0.1.0"
edition = "2021"
description = "HTML, SVG and MHTML viewer for Inf-Dir Quick View"

[dependencies]
http = "1"
percent-encoding = "2.3"
viewer-web-shell = { path = "../viewer-web-shell" }
viewer-window-placement = { path = "../viewer-window-placement" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
