[package]
name = "markdown-view"
version = "0.1.0"
edition = "2021"
description = "Markdown viewer (GFM) for Inf-Dir Quick View (WebView2 + markdown-it)"

[dependencies]
dpi = "0.1"
http = "1"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
wry = "0.56"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
