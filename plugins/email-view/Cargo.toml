[package]
name = "email-view"
version = "0.1.0"
edition = "2021"
description = "Email viewer (.msg/.eml/.emlx/.oft/winmail.dat) for Inf-Dir Quick View (WebView2 shell + AOT .NET parser)"

[dependencies]
http = "1"
percent-encoding = "2.3"
serde_json = "1"
viewer-web-shell = { path = "../viewer-web-shell" }
viewer-window-placement = { path = "../viewer-window-placement" }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
