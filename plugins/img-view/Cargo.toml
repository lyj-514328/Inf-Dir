[package]
name = "img-view"
version = "0.1.0"
edition = "2021"
description = "A lightweight image viewer for Inf-Dir Quick View"

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "gif", "bmp", "webp", "avif", "tiff", "ico", "hdr",
    "pnm", "tga", "dds", "exr", "ff", "qoi"
] }
resvg = "0.48"
eframe = "0.29"
egui = "0.29"
viewer-window-placement = { path = "../viewer-window-placement" }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
